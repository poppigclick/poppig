<!DOCTYPE html>
<html lang="km"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff93c2"><title>POPPIG - Pop the Pig</title>
<meta name="description" content="POPPIG - Click the pig. Climb the leaderboard. Battle other countries. Free online clicking game.">
<meta property="og:title" content="POPPIG - Pop the pig, battle countries"><meta property="og:description" content="Click the pig. Climb the leaderboard. Battle other countries.">
<meta property="og:type" content="website"><meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B7%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--g:#c2185b;--card:rgba(255,245,249,.92);--line:#f5a9c8}
html,body{margin:0;height:100%;color:#5a1237;font-family:system-ui,"Segoe UI",sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;
 background:radial-gradient(ellipse at 50% 15%,#ffc2dc 0,#ff93c2 55%,#f2679f 100%)}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 9px);pointer-events:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding:14px 14px 6px}
#head{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px;min-height:130px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-weight:800;letter-spacing:1.5px;font-size:15px;text-transform:uppercase}
#rank{color:var(--g);font-weight:800;letter-spacing:2px;font-size:15px;margin:10px 0 0 8px;text-transform:uppercase}
#onl{margin-top:8px;font-size:14px;color:#5a1237;font-weight:700;letter-spacing:1.5px}
#onl i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g);margin-right:6px}
#pops{font-size:46px;font-weight:900;text-align:center;color:#fff;text-shadow:3px 4px 0 rgba(160,20,90,.55);line-height:1;margin-top:6px}
#plbl{text-align:center;color:#7a1a4a;letter-spacing:5px;font-size:13px;margin-top:6px;opacity:.8}
#cpsw{justify-self:end;text-align:right}
#cps{display:inline-block;background:var(--g);color:#fff;border-radius:30px;padding:8px 18px;font-weight:900;font-size:22px}
#cps small{font-size:14px;letter-spacing:2px}
#snd{display:block;margin:10px 0 0 auto;background:none;border:0;font-size:22px;color:#5a1237}
#stage{flex:1;position:relative;margin:0 -14px;border-radius:44px 44px 0 0;background:linear-gradient(#ffffff,#ffe6f0);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;overflow:hidden}
#stage img{position:absolute;height:92%;max-width:90%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(120,40,70,.35))}
#pigB{display:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:26px;margin-top:10px;padding:12px 16px}
#vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-weight:800;letter-spacing:1px;font-size:13px;text-transform:uppercase}
#vs .m{text-align:center;color:var(--g);font-size:12px}
#vs .r{text-align:right}
#vs b{color:var(--g)}
#bar{height:16px;border-radius:10px;background:rgba(255,255,255,.7);margin-top:10px;overflow:hidden}
#bar div{height:100%;background:var(--g);width:50%;transition:width .3s}
#lb{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:3px;cursor:pointer;font-size:15px}
#lb span{color:var(--g);letter-spacing:1px}
#panel{display:none;position:absolute;left:14px;right:14px;bottom:128px;max-height:56%;overflow:auto;background:rgba(255,242,248,.98);border:1px solid var(--line);border-radius:26px;padding:12px;z-index:5}
#tabs{display:flex;background:#ffd3e4;border-radius:14px;padding:4px;margin-bottom:8px}
#tabs button{flex:1;border:0;background:none;color:#a3507a;font-weight:800;font-size:16px;letter-spacing:1px;padding:11px 0;border-radius:11px}
#tabs button.on{background:var(--g);color:#fff}
.row{display:grid;grid-template-columns:44px 40px 1fr auto;align-items:center;gap:8px;padding:10px 4px;font-size:17px;font-weight:700}
.row .n{color:var(--g);font-weight:900;font-size:14px}.row .f{font-size:28px}.row .v{color:var(--g);font-weight:900}
.row.me{background:rgba(194,24,91,.12);border-radius:12px}
.plus{position:fixed;font-size:34px;font-weight:900;color:#fff;pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 2px 6px #a3125f;z-index:9}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-110px)}}
.ring{position:fixed;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;border:7px solid rgba(233,30,140,.55);pointer-events:none;z-index:8;animation:ring .7s ease-out forwards}
@keyframes ring{from{transform:scale(.15);opacity:.9}to{transform:scale(1);opacity:0}}
.popw{position:fixed;font-family:"Bowlby One","Arial Black",sans-serif;font-size:42px;color:rgba(194,24,91,.6);-webkit-text-stroke:2px rgba(255,255,255,.8);pointer-events:none;z-index:8;animation:pw .75s ease-out forwards}
@keyframes pw{from{opacity:1;transform:translate(-50%,0) rotate(var(--r))}to{opacity:0;transform:translate(-50%,-90px) rotate(var(--r))}}
</style></head><body><div id="app">
<div id="head">
 <div><span class="pill" id="where">🌐 Somewhere</span><div id="rank">Rank #- Worldwide</div><div class="pill" id="onl" style="font-size:14px"><span><i></i>0 ONLINE</span></div></div>
 <div><div id="pops">0</div><div id="plbl">POPS</div></div>
 <div id="cpsw"><span id="cps">0 <small>CPS</small></span><button id="snd">🔊</button></div>
</div>
<div id="stage"><img id="pigA" src="pig1.png" alt=""><img id="pigB" src="pig2.png" alt=""></div>
<div class="box" id="vsbox"><div id="vs"></div><div id="bar"><div></div></div></div>
<div class="box" id="lb"><span style="color:#5a1237;letter-spacing:3px">COUNTRY LEADERBOARD</span><span id="tg">Show</span></div>
<div id="panel"><div id="tabs"><button data-t="all" class="on">ALL-TIME</button><button data-t="day">TODAY</button></div><div id="rows"></div></div>
</div>
<script>
// ដាក់ Firebase URL នៅទីនេះ (ឧ. "https://xxxx-default-rtdb.firebaseio.com")
const FB = "https://poppigclick-default-rtdb.firebaseio.com";

const $=id=>document.getElementById(id), DAY=new Date().toISOString().slice(0,10);
const pid=localStorage.pp_id||(localStorage.pp_id=Math.random().toString(36).slice(2,10));
let mine=+(localStorage.pp_mine||0),dayMine=+(localStorage["pp_d"+DAY]||0),code="XX",cname="Somewhere",pending=0,times=[],players={},totals={},daily={},tab="all",lastW=0,muted=localStorage.pp_mute==="1";
const flag=c=>/^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):"🌐";
const nm=c=>{try{return new Intl.DisplayNames(["en"],{type:"region"}).of(c)}catch(e){return c}};
const fmt=n=>Math.round(n).toLocaleString();
const myCps=()=>{const n=Date.now();times=times.filter(t=>n-t<1000);return times.length};

async function geo(){for(const u of["https://api.country.is","https://ipapi.co/json/"]){try{const j=await(await fetch(u)).json();const c=(j.country||j.country_code||"").toUpperCase();if(c.length===2){code=c;cname=nm(c);return}}catch(e){}}}

function stats(){
  const now=Date.now(),cps={};let online=0;
  for(const [c,ps] of Object.entries(players||{}))for(const p of Object.values(ps||{}))if(p&&now-p.t<12000){online++;cps[c]=(cps[c]||0)+(p.c||0)}
  const T={...totals},D={...daily};
  if(!FB){cps[code]=myCps();online=1;T[code]=mine;D[code]=dayMine}
  const ks=[...new Set([...Object.keys(T),...Object.keys(cps),...Object.keys(D)])];
  return {online,cps,T,D,ks,world:Object.values(T).reduce((a,b)=>a+b,0)};
}
function render(){
  const s=stats(),c=myCps();
  const byCps=s.ks.slice().sort((a,b)=>(s.T[b]||0)-(s.T[a]||0)||(s.cps[b]||0)-(s.cps[a]||0));
  const rank=byCps.indexOf(code)+1;
  $("where").textContent=flag(code)+" "+cname; $("rank").textContent="Rank #"+(rank||"-")+" Worldwide";
  $("onl").firstChild.innerHTML="<i></i>"+s.online+" ONLINE";
  $("pops").textContent=fmt(s.world); $("cps").innerHTML=c+" <small>CPS</small>";
  // vs bar: ប្រទេសខ្លួន ប្រឆាំងប្រទេសបន្ទាប់ពីលើ (ឬពីក្រោមបើនាំមុខ)
  const idx=byCps.indexOf(code), rival=idx>0?byCps[idx-1]:byCps[idx+1];
  if(rival){
    const a=s.T[code]||0,b=s.T[rival]||0,gap=b-a;
    $("vs").innerHTML=`<div>${flag(code)} ${nm(code).slice(0,9)} <b>${s.cps[code]||0} CPS</b></div><div class="m">${fmt(Math.abs(gap))} ${gap>0?"BEHIND":"AHEAD"}<br>${gap>0?"CATCHING UP":"LEADING"}</div><div class="r"><b>${s.cps[rival]||0} CPS</b> ${nm(rival).slice(0,9)} ${flag(rival)}</div>`;
    $("bar").firstChild.style.width=(a+b?Math.max(5,Math.min(95,a/(a+b)*100)):50)+"%";
  }else{$("vs").innerHTML=`<div>${flag(code)} ${nm(code)} <b>${c} CPS</b></div><div></div><div class="r">Waiting for rivals...</div>`;$("bar").firstChild.style.width="100%"}
  const list=(tab==="all"?s.ks.filter(k=>s.T[k]).sort((a,b)=>s.T[b]-s.T[a]).map(k=>[k,fmt(s.T[k])]):s.ks.filter(k=>s.D[k]).sort((a,b)=>s.D[b]-s.D[a]).map(k=>[k,fmt(s.D[k])]));
  $("rows").innerHTML=list.slice(0,40).map(([k,v],i)=>`<div class="row ${k===code?"me":""}"><span class="n">#${i+1}</span><span class="f">${flag(k)}</span><span>${nm(k)}</span><span class="v">${v}</span></div>`).join("")||"<div class=row>No players yet</div>";
}
async function send(){
  if(!FB)return;const c=myCps(),n=pending;pending=0;
  try{const q=[fetch(`${FB}/players/${code}/${pid}.json`,{method:"PUT",body:JSON.stringify({c,t:Date.now()})})];
    if(n){q.push(fetch(`${FB}/countries.json`,{method:"PATCH",body:JSON.stringify({[code]:{".sv":{increment:n}}})}));
          q.push(fetch(`${FB}/daily/${DAY}.json`,{method:"PATCH",body:JSON.stringify({[code]:{".sv":{increment:n}}})}))}
    await Promise.all(q)}catch(e){pending+=n}
}
async function poll(){if(!FB)return;try{const g=async p=>(await(await fetch(FB+p)).json())||{};[players,totals,daily]=await Promise.all([g("/players.json"),g("/countries.json"),g("/daily/"+DAY+".json")])}catch(e){}}

let ac;
function popSound(){if(muted)return;try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="sine";
  o.frequency.setValueAtTime(700+Math.random()*80,t);o.frequency.exponentialRampToValueAtTime(130,t+.09);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.12)}catch(e){}}

function fx(x,y){
  for(let i=0;i<3;i++){const r=document.createElement("div");r.className="ring";r.style.left=x+"px";r.style.top=y+"px";r.style.animationDelay=i*.09+"s";r.style.opacity=0;document.body.appendChild(r);setTimeout(()=>r.remove(),1000)}
  const n=1+(Math.random()<.5);
  for(let i=0;i<n;i++){const w=document.createElement("div");w.className="popw";w.textContent=["pop","poppig","oink"][Math.floor(Math.random()*3)];w.style.setProperty("--r",(Math.random()*20-10)+"deg");
    w.style.left=(x+Math.random()*40-20)+"px";w.style.top=(y-60-i*34)+"px";document.body.appendChild(w);setTimeout(()=>w.remove(),800)}
}
function pop(x,y){
  const m=1;mine+=m;dayMine+=m;pending+=m;times.push(Date.now());localStorage.pp_mine=mine;localStorage["pp_d"+DAY]=dayMine;popSound();
  $("pigA").style.display="none";$("pigB").style.display="block";clearTimeout(pop.t);
  pop.t=setTimeout(()=>{$("pigB").style.display="none";$("pigA").style.display="block"},120);
  const p=document.createElement("div");p.className="plus";p.textContent="+"+m;
  p.style.left=(x+Math.random()*60-30)+"px";p.style.top=(y-50)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),800);
  fx(x,y);if(Date.now()-lastW>1000){lastW=Date.now();send()}render();
}
$("stage").addEventListener("pointerdown",e=>pop(e.clientX,e.clientY));
addEventListener("keydown",e=>{if(!e.repeat)pop(innerWidth/2,innerHeight/2)});
$("lb").onclick=()=>{const p=$("panel"),o=p.style.display==="block";p.style.display=o?"none":"block";$("tg").textContent=o?"Show":"Hide"};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("snd").textContent=muted?"🔇":"🔊";
$("snd").onclick=()=>{muted=!muted;localStorage.pp_mute=muted?"1":"0";$("snd").textContent=muted?"🔇":"🔊"};
geo().then(()=>{send();poll()});
setInterval(send,5000);setInterval(poll,2000);setInterval(render,300);render();
</script></body></html>
